<div class="portfolio-wrapper">
    
    <div class="section-header">
        <h2 class="section-title">Portfolio</h2>
    </div>

    <div class="filters-container">
        <ul class="portfolio-filters">
            <li>
                <button (click)="setFilter('all')" [class.active]="currentFilter === 'all'">Tout</button>
            </li>
            <li>
                <button (click)="setFilter('web')" [class.active]="currentFilter === 'web'">Web</button>
            </li>
            <li>
                <button (click)="setFilter('design')" [class.active]="currentFilter === 'design'">Design</button>
            </li>
            <li>
                <button (click)="setFilter('life')" [class.active]="currentFilter === 'life'">Parcours</button>
            </li>
        </ul>
    </div>

    <div class="projects-grid">
        <div class="project-card" *ngFor="let project of filteredProjects">
            
            <div class="card-media">
                <img [src]="project.image" [alt]="project.title">
                <div class="overlay" (click)="openModal(project)">
                    <span class="plus-icon">+</span>
                </div>
            </div>
            
            <div class="card-info">
                <span class="category">{{ project.categoryDisplay }}</span>
                <h3>{{ project.title }}</h3>
            </div>

        </div>
    </div>

</div>

<app-modal 
    [project]="selectedProject" 
    [isOpen]="isModalOpen" 
    (close)="closeModal()">
</app-modal>
